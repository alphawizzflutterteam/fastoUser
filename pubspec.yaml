flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/cars/
    - assets/users/
    - assets/svg/
    - lib/language/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter.ttf

    - family: Olden
      fonts:
        - asset: assets/fonts/olden.ttf
    - family: Caveat
      fonts:
        - asset: assets/fonts/caveat.ttf

    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto.ttf

    - family: SofiaSans
      fonts:
        - asset: assets/fonts/SofiaSans.ttf

    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf